services:
  workspace:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    command: sleep infinity
    volumes:
      - ..:/workspaces/ai-engineering-studio:cached
      - ollama-data:/workspaces/.ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WORK_OLLAMA_CODING_MODEL: ${WORK_OLLAMA_CODING_MODEL:-qwen3-coder}
      WORK_OLLAMA_REASONING_MODEL: ${WORK_OLLAMA_REASONING_MODEL:-qwen3}
      WORK_OLLAMA_FAST_MODEL: ${WORK_OLLAMA_FAST_MODEL:-gemma3:4b}
      WORK_OLLAMA_GENERAL_MODEL: ${WORK_OLLAMA_GENERAL_MODEL:-llama3.3}
    depends_on:
      ollama:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /root/.ollama/models
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ollama-data:
